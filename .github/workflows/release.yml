name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine next version
        id: version
        shell: pwsh
        run: |
          $patches = git tag --list 'v0.0.*' |
            ForEach-Object {
              if ($_ -match '^v0\.0\.(\d+)$') {
                [int]$Matches[1]
              }
            }
          $patch = if ($patches) {
            ($patches | Measure-Object -Maximum).Maximum + 1
          } else {
            1
          }
          "release=0.0.$patch" >> $env:GITHUB_OUTPUT
          "package=0.0.$patch.0" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test .\tests\PiPEverywhere.Tests\PiPEverywhere.Tests.csproj -c Release

      - name: Import persistent signing certificate
        id: signing
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:SIGNING_PFX_BASE64 -or -not $env:SIGNING_PFX_PASSWORD) {
            throw 'The persistent signing certificate secrets are not configured.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'PiPEverywhere-signing.pfx'
          [System.IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
          )
          $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password `
            -Exportable

          if ($certificate.Subject -ne 'CN=Aasim Khan') {
            throw "Unexpected signing certificate subject: $($certificate.Subject)"
          }
          if ($certificate.NotAfter -le (Get-Date).AddMonths(6)) {
            throw "The signing certificate expires too soon: $($certificate.NotAfter)"
          }
          $cerPath = Join-Path $env:RUNNER_TEMP 'PiPEverywhere.cer'
          Export-Certificate -Cert $certificate -FilePath $cerPath -Force | Out-Null
          Import-Certificate `
            -FilePath $cerPath `
            -CertStoreLocation Cert:\CurrentUser\TrustedPeople | Out-Null
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build x64 installer
        shell: pwsh
        run: >
          .\scripts\Build-DevelopmentPackage.ps1
          -Architecture x64
          -Version '${{ steps.version.outputs.package }}'
          -RequireExistingCertificate

      - name: Build ARM64 installer
        shell: pwsh
        run: >
          .\scripts\Build-DevelopmentPackage.ps1
          -Architecture arm64
          -Version '${{ steps.version.outputs.package }}'
          -RequireExistingCertificate

      - name: Prepare auto-update feeds
        shell: pwsh
        run: >
          .\scripts\Prepare-ReleaseArtifacts.ps1
          -Version '${{ steps.version.outputs.package }}'
          -Repository '${{ github.repository }}'

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
        shell: pwsh
        run: |
          gh release create "v$env:RELEASE_VERSION" `
            .\artifacts\msix\PiPEverywhere-x64-$env:RELEASE_VERSION.zip `
            .\artifacts\msix\PiPEverywhere-arm64-$env:RELEASE_VERSION.zip `
            .\artifacts\msix\release\PiPEverywhere-x64.msix `
            .\artifacts\msix\release\PiPEverywhere-arm64.msix `
            .\artifacts\msix\release\Microsoft.WindowsAppRuntime.2-x64.msix `
            .\artifacts\msix\release\Microsoft.WindowsAppRuntime.2-arm64.msix `
            .\artifacts\msix\release\PiPEverywhere-x64.appinstaller `
            .\artifacts\msix\release\PiPEverywhere-arm64.appinstaller `
            .\artifacts\msix\release\PiPEverywhere.cer `
            --target "$env:GITHUB_SHA" `
            --title "PiP Everywhere $env:RELEASE_VERSION" `
            --generate-notes
