name: store-release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.0.9 (blank uses the next patch)
        type: string
        required: false
      publish:
        description: Submit this build to the Microsoft Store
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: store-release
  cancel-in-progress: false

env:
  STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}

jobs:
  build:
    runs-on: windows-latest

    outputs:
      release_version: ${{ steps.version.outputs.release }}
      package_version: ${{ steps.version.outputs.package }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify Native AOT toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudioPath = & $vswhere -latest -products * -property installationPath
          $toolRoot = Join-Path $visualStudioPath 'VC\Tools\MSVC'
          foreach ($architecture in @('x64', 'arm64')) {
            $linker = Get-ChildItem $toolRoot -Filter link.exe -Recurse |
              Where-Object FullName -Match "\\Hostx64\\$architecture\\link\.exe$" |
              Select-Object -First 1
            if (-not $linker) {
              throw "The $architecture C++ linker required by Native AOT is not installed."
            }
          }

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $requestedVersion = '${{ inputs.version }}'.Trim()
          if ($requestedVersion) {
            if ($requestedVersion -notmatch '^\d+\.\d+\.\d+$') {
              throw 'The requested version must use the format 0.0.9.'
            }
            "release=$requestedVersion" >> $env:GITHUB_OUTPUT
            "package=$requestedVersion.0" >> $env:GITHUB_OUTPUT
          }
          else {
            $version = .\scripts\Get-ReleaseVersion.ps1
            "release=$($version.Release)" >> $env:GITHUB_OUTPUT
            "package=$($version.Package)" >> $env:GITHUB_OUTPUT
          }

      - name: Test
        run: dotnet test .\tests\PiPEverywhere.Tests\PiPEverywhere.Tests.csproj -c Release

      - name: Build x64 and ARM64 Store upload
        shell: pwsh
        run: >
          .\scripts\Build-StorePackage.ps1
          -Version '${{ steps.version.outputs.package }}'

      - name: Upload validated Store package
        uses: actions/upload-artifact@v7
        with:
          name: PiPEverywhere-Store-${{ steps.version.outputs.release }}
          path: artifacts/store/*.msixupload
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: >-
      (github.event_name == 'push' && vars.STORE_PUBLISHING_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: windows-latest
    environment: microsoft-store

    steps:
      - uses: actions/checkout@v7

      - name: Download validated Store package
        uses: actions/download-artifact@v8
        with:
          name: PiPEverywhere-Store-${{ needs.build.outputs.release_version }}
          path: artifacts/store

      - name: Set up Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure Partner Center authentication
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          if (-not $env:STORE_PRODUCT_ID) {
            throw 'The STORE_PRODUCT_ID repository variable is not configured.'
          }

          $required = @(
            'PARTNER_CENTER_TENANT_ID',
            'PARTNER_CENTER_SELLER_ID',
            'PARTNER_CENTER_CLIENT_ID',
            'PARTNER_CENTER_CLIENT_SECRET'
          )
          foreach ($name in $required) {
            if (-not (Get-Item "env:$name").Value) {
              throw "The $name secret is not configured."
            }
          }

          msstore reconfigure `
            --tenantId $env:PARTNER_CENTER_TENANT_ID `
            --sellerId $env:PARTNER_CENTER_SELLER_ID `
            --clientId $env:PARTNER_CENTER_CLIENT_ID `
            --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET

      - name: Verify Partner Center access
        shell: pwsh
        run: msstore apps get $env:STORE_PRODUCT_ID

      - name: Submit to Microsoft Store
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts\store -Filter *.msixupload |
            Select-Object -First 1
          if (-not $package) {
            throw 'The Store upload package was not downloaded.'
          }
          msstore publish `
            . `
            --inputDirectory $package.DirectoryName `
            --appId $env:STORE_PRODUCT_ID

      - name: Record submission status
        shell: pwsh
        run: |
          "## Microsoft Store submission" >> $env:GITHUB_STEP_SUMMARY
          'The package was uploaded and submitted for Microsoft certification.' >> $env:GITHUB_STEP_SUMMARY
          'Certification and rollout continue asynchronously in Partner Center.' >> $env:GITHUB_STEP_SUMMARY
          msstore submission status $env:STORE_PRODUCT_ID |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
